services:
  - type: web
    name: sound-doodles
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ROOM_TTL_MINUTES
        value: "120"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
