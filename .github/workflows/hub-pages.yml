# Publishes the landing page in hub/ to GitHub Pages. Games are hosted separately.
name: Deploy hub to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['hub/**', '.github/workflows/hub-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub
      - id: deployment
        uses: actions/deploy-pages@v4
